
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friday Night Funkin': New Rivals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game-container">

        <header id="game-header">
            <h1>FRIDAY NIGHT FUNKIN'</h1>
            <h2>NEW RIVALS</h2>
        </header>

        
<main id="main-menu">

    <h2>MAIN MENU</h2>

    <nav id="menu-options">
        <button>STORY MODE</button>
        <button>FREE PLAY</button>
        <button>PRACTICE MODE</button>
        <button>CHARACTER GALLERY</button>
        <button>SONG GALLERY</button>
        <button>SETTINGS</button>
        <button>CREDITS</button>
    </nav>

</main>

<main id="story-mode" hidden>

    <h2>STORY MODE</h2>

    <p>Select a week!</p>

    <div id="week-list">

        <button class="week-button" data-week="1">
            WEEK 1 — ORIGINAL SOUNDTRACK
        </button>

        <button class="week-button" data-week="2" disabled>
            WEEK 2 — LOCKED
        </button>

        <button class="week-button" data-week="3" disabled>
            WEEK 3 — LOCKED
        </button>

        <button class="week-button" data-week="4" disabled>
            WEEK 4 — LOCKED
        </button>

        <button class="week-button" data-week="5" disabled>
            WEEK 5 — LOCKED
        </button>

        <button class="week-button" data-week="6" disabled>
            WEEK 6 — LOCKED
        </button>

        <button class="week-button" data-week="7" disabled>
            WEEK 7 — LOCKED
        </button>

        <button class="week-button" data-week="8" disabled>
            WEEK 8 — LOCKED
        </button>

        <button class="week-button" data-week="9" disabled>
            WEEK 9 — LOCKED
        </button>

        <button class="week-button" data-week="10" disabled>
            WEEK 10 — LOCKED
        </button>

    </div>

    <button id="back-to-menu">BACK</button>

</main>

<!-- WEEK 1 SONG SELECTION -->

<main id="week1-song-screen" hidden>

    <h2>WEEK 1 — SONG SELECTION</h2>

    <p>Select your song!</p>

    <div id="song-list"></div>

    <h3>SELECT DIFFICULTY</h3>

    <div id="difficulty-list"></div>

    <button id="start-song-button" disabled>
        START SONG
    </button>

    <button id="back-to-weeks">
        BACK TO WEEKS
    </button>

</main>

<!-- RHYTHM GAMEPLAY SCREEN -->

<main id="gameplay-screen" hidden>

    <h2>JELLYFISH JAM</h2>

    <p id="song-info">
        SpongeBob vs. Boyfriend
    </p>

    <div id="game-stage">

        <div id="opponent-side">
            <h3>SPONGEBOB</h3>
            <div id="opponent-notes"></div>
        </div>

        <div id="player-side">
            <h3>BOYFRIEND</h3>
            <div id="player-notes"></div>
        </div>

    </div>

    <p id="song-timer">0:00 / 4:00</p>

    <button id="pause-song-button">PAUSE</button>

</main>

        <footer>
            <p>Press Start to Begin!</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
